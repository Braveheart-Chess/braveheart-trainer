version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # nnue-eval's workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  # The trainer's own workspace and lock.
  - package-ecosystem: cargo
    directory: /trainer
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
